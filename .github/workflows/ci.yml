name: forky-buildkit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_build:
        description: 'Compile this repaired source with host Rust on Forky; vendor and rebuild offline'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    container: debian:forky
    steps:
      - name: Bootstrap test tools in this disposable Forky container
        run: apt-get update --error-on=any && apt-get install -y --no-install-recommends ca-certificates git make python3 build-essential binutils pkgconf clang
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # supplied pinned action; not exercised during local validation
        with:
          persist-credentials: false
      - run: make fetch verify-source lint test
      - name: Validate the actual distributed entrypoints after extraction
        shell: bash
        run: |
          make snapshot-dist
          mkdir /tmp/kit-release-check
          tar -xzf dist/resctl-bench-2.2.6-complete-source-2.3.1.tar.gz -C /tmp/kit-release-check
          cd /tmp/kit-release-check/resctl-bench
          sha256sum -c SHA256SUMS
          PYTHONSAFEPATH=1 make help fetch verify-source lint test
  real-upstream:
    if: github.event_name == 'workflow_dispatch' && inputs.upstream_build
    # Administrators provide this runner with Rust and Debian dependencies.
    # This job NEVER provisions/updates a Rust toolchain or the package manager.
    runs-on: [self-hosted, linux, resctl-host-rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # retained supplied pin; not revalidated here
        with:
          persist-credentials: false
      - name: Verify the preinstalled host tools
        run: make doctor TOOLCHAIN=host TUNE=portable
      - run: make package verify source-dist TOOLCHAIN=host TUNE=portable
      - name: Relocate the populated source distribution and compile offline
        shell: bash
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          tar -xzf dist/resctl-bench-buildkit-*-source-*.tar.gz -C "$scratch"
          cd "$scratch"/resctl-bench-buildkit-*-source-*
          make package verify OFFLINE=1 TOOLCHAIN=host TUNE=portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # retained supplied pin; not revalidated here
        with:
          name: forky-release-and-source
          path: dist/*
          if-no-files-found: error
