name: forky-buildkit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_build:
        description: 'Build actual current upstream and newest nightly on Forky; vendor and rebuild offline'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    container: debian:forky
    steps:
      - name: Bootstrap test tools in this disposable Forky container
        run: apt-get update --error-on=any && apt-get install -y --no-install-recommends ca-certificates git make python3 build-essential binutils pkgconf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint test
  real-upstream:
    if: github.event_name == 'workflow_dispatch' && inputs.upstream_build
    runs-on: ubuntu-latest
    container: debian:forky
    env:
      ALLOW_ROOT_BUILD: '1' # Only for this disposable container, not your host.
      TUNE: portable
    steps:
      - run: apt-get update --error-on=any && apt-get install -y --no-install-recommends ca-certificates curl git make python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision rustup only in disposable CI (host already has it)
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: make latest-complete verify
      - name: Relocate the populated source distribution and compile offline
        shell: bash
        run: |
          mkdir /tmp/relocated-build
          tar -xzf dist/resctl-bench-buildkit-*-source-*.tar.gz -C /tmp/relocated-build
          cd /tmp/relocated-build/resctl-bench-buildkit-*-source-*
          make package verify OFFLINE=1 TUNE=portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forky-release-and-source
          path: dist/*
          if-no-files-found: error
